# ONE-TIME signing-secrets migration to Nwokike/voicelm.
# Packs the repo's 4 signing secrets into a 1-day artifact (file-only —
# no secret value is ever written to logs/stdout). Delete after use.
name: Fetch Signing Secrets (one-time)

on:
  workflow_dispatch:

jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - name: Materialize secrets to files
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p out
          # original base64 string as stored (what the target repo's secret needs)
          printf '%s' "$KEYSTORE_BASE64" > out/keystore.b64
          # decode for a validity sanity check only
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > out/kiri_keystore.jks
          printf '%s' "$KEY_ALIAS" > out/alias.txt
          printf '%s' "$KEYSTORE_PASSWORD" > out/storepw.txt
          printf '%s' "$KEY_PASSWORD" > out/keypw.txt
          test -s out/keystore.b64
          test -s out/kiri_keystore.jks
          test -s out/alias.txt
          test -s out/storepw.txt
          test -s out/keypw.txt
          cd out && zip -q ../signing-secrets.zip ./*

      - name: Upload artifact (retention: 1 day)
        uses: actions/upload-artifact@v4
        with:
          name: signing-secrets
          path: signing-secrets.zip
          retention-days: 1
          if-no-files-found: error
