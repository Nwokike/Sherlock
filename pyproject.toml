[project]
name = "sherlock"
version = "2.0.0"
description = "Sherlock: Hunt down social media accounts by username across 400+ networks."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "flet==0.85.0",
    "flet-ads==0.85.0",
    # Pinned on purpose: sherlock-project requires stem (>=1.8.0,<2.0.0)
    # but PyPI ships no wheel for Android cross-builds — CI precompiles
    # this exact version and installs it via PIP_FIND_LINKS.
    "stem==1.8.1",
    "sherlock-project>=0.16.0",
    "holehe>=1.61",
    "socid-extractor>=0.1.1",
]

[tool.flet]
org = "ng.kiri"
product = "Sherlock"
build_number = 8

[tool.flet.app]
path = "src"
startup_message = "Initializing Sherlock..."

[tool.flet.android]
bundle_id = "ng.kiri.sherlock"

[tool.flet.android.manifest_application]
usesCleartextTraffic = "true"
requestLegacyExternalStorage = "true"

[tool.flet.android.meta_data]
"com.google.android.gms.ads.APPLICATION_ID" = "ca-app-pub-5679949845754640~1261089274"

[tool.flet.android.permission]
"android.permission.INTERNET" = true
"android.permission.ACCESS_NETWORK_STATE" = true
"android.permission.WAKE_LOCK" = true

[tool.flet.android.feature]
"android.software.leanback" = false
"android.hardware.touchscreen" = true

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.uv.workspace]
members = [
    "sherlock-app",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.15.14",
]

[ruff]
lint.extend-ignore = ["BLE001", "S110"]
