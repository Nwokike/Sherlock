[project]
name = "sherlock"
version = "2.3.0"
description = "Sherlock: Hunt down social media accounts by username across 5,200+ networks."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "flet>=1.0.1",
    "flet-ads>=1.0.1",
    "flet-local-auth>=1.0.1",
    "holehe-v2>=1.0.3",
    "httpx[http2,socks]>=0.28.1",
    "maigret>=0.6.6",
    "socid-extractor>=0.1.1",
]

[tool.flet]
org = "ng.kiri"
product = "Sherlock"
description = "Sherlock: Hunt down social media accounts by username across 5,200+ networks."
company = "Kiri"
copyright = "Copyright © 2026 Kiri. All rights reserved."
build_number = 13
icon = "src/assets/icon.png"

[tool.flet.app]
path = "src"

[tool.flet.boot_screen]
name = "flet"

[tool.flet.boot_screen.flet]
startup_message = "Initializing Sherlock..."

[tool.flet.android]
bundle_id = "ng.kiri.sherlock"
target_arch = ["arm64-v8a", "x86_64"]
# Branded adaptive-icon backdrop (app dark tone) — also drives the
# Android 12+ splash background behind the launcher icon.
adaptive_icon_background = "#1c1a14"

[tool.flet.android.manifest_application]
usesCleartextTraffic = "true"
requestLegacyExternalStorage = "true"

[tool.flet.android.meta_data]
"com.google.android.gms.ads.APPLICATION_ID" = "ca-app-pub-5679949845754640~1261089274"

[tool.flet.android.permission]
"android.permission.INTERNET" = true
"android.permission.ACCESS_NETWORK_STATE" = true
"android.permission.WAKE_LOCK" = true
"android.permission.USE_BIOMETRIC" = true

[tool.flet.android.feature]
"android.software.leanback" = false
"android.hardware.touchscreen" = true

[tool.flet.android.signing]
key_store = "../../../../kiri_keystore.jks"
key_alias = "upload"

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = ["-ra", "-q"]
# Hard per-test ceiling: a hang (network stub regression, worker deadlock)
# fails that test instead of stalling CI for the default 0 (no limit).
timeout = 60
strict_markers = true
strict_config = true
markers = [
    "live: hits the real network (run explicitly with -m live; CI uses -m 'not live')",
]
filterwarnings = [
    # Owner rule: NEVER suppress/ignore warnings. Any warning raised by OUR
    # code (module-scoped below) escalates to a hard error so it must be
    # fixed. Third-party warnings are left at default — they stay visible in
    # pytest's warnings summary on every run, never ignored, but cannot
    # brick the suite for code we don't own.
    "error:::^(services|screens|components|core|state|hooks|tests)(\\.|$)|^(app_shell|main)$",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-timeout>=2.4",
    "ruff>=0.15.14",
]

[tool.ruff.lint]
select = [
    "E", "F", "W", "UP", "B", "Q", "C4", "PERF", "ERA", "I", "T20", "DTZ", "RUF",
    "S", "TRY", "BLE", "EM", "A", "SIM", "RET", "RSE",
]
ignore = [
    "E501",
    # Message-string style: this app raises with inline human messages on
    # purpose (owner rule: visible, specific errors); classes-per-message
    # would be churn with no behavioral gain.
    "EM101", "EM102", "EM103", "TRY003",
    # Wide-except + log (BLE001) and silent best-effort no-ops (S110,
    # SIM105) are the documented owner pattern across services/UI: cleanup,
    # restore, and persist paths intentionally pass on failure while every
    # load-bearing path logs. Narrowing 200+ sites is regression churn.
    "BLE001", "S110", "SIM105",
    # TRY300/TRY301 are style-only reshuffles inside engine hot paths
    # (email/sherlock) — churn risk with zero behavioral gain.
    "TRY300", "TRY301",
]

[tool.ruff.lint.per-file-ignores]
# Tests assert by design (pytest); S105 is a storage-KEY name, not a secret.
"tests/**" = ["S101"]

# Build-time pruning: serious_python cleanup globs — the ONLY channel that
# shrinks artifacts (post-build rm cannot; deps are re-packaged from
# project.dependencies into build/site-packages). Verified safe in
# docs/dependency-study.md §4/§5: locales are gettext our paths never read;
# oauthlib = flet OAuth (no login flow here); flask stack = maigret/web only.
[tool.flet.cleanup]
package_files = [
    "pycountry/locales/**/LC_MESSAGES/*.mo",
    "pycountry/locales/**/*.po",
    "oauthlib/**",
    "flask/**",
    "werkzeug/**",
    "click/**",
    "blinker/**",
    "itsdangerous/**",
    "asgiref/**",
]
