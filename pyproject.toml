[project]
name = "sherlock"
version = "2.4.0"
description = "Sherlock: Hunt down social media accounts by username across 11,000+ networks."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "flet>=1.1.2",
    "flet-ads>=1.1.2",
    "flet-notifications>=1.1.2",
    "holehe-v2>=1.0.3",
    "httpx[http2,socks]>=0.28.1",
    "maigret>=0.6.7",
    # maigret 0.6.7 pins networkx <3.0.0, so 2.8.8 is the latest compatible.
    # (networkx 3.x would also give a scipy-free pagerank, but it conflicts.)
    "networkx>=2.8.8,<3.0.0",
    "phonsint>=0.1.0",
    "socid-extractor>=0.1.2",
]

[tool.flet]
org = "ng.kiri"
product = "Sherlock"
description = "Sherlock: Hunt down social media accounts by username across 11,000+ networks."
company = "Kiri"
build_number = 14

[tool.flet.app]
path = "src"
# No `assets_dir` here: flet-cli 1.0.4 does not read that key at all
# (run.py/build_base.py read only path/module). main() resolves
# Path(__file__).parent/"assets" and passes it to ft.run() directly, which
# works under `flet run`, a direct launch, and a build.

[tool.flet.boot_screen]
name = "flet"

[tool.flet.boot_screen.flet]
startup_message = "Initializing Sherlock..."

[tool.flet.android]
# Compress native libs in the APK (pre-0.86 behaviour): since 0.86 flet stores
# them uncompressed by default, which doubled APK download size.
legacy_packaging = true
bundle_id = "ng.kiri.sherlock"
target_arch = ["arm64-v8a", "x86_64"]
# Our own Android resources (notification small icon drawables), copied into
# the generated android/app/src/main/res by `flet build`.
res_dir = "android_res"
# serious_python stores pure-Python packages in ZIPs on Android (zipimport).
# phonsint discovers its validators with Path(__file__).parent.parent /
# "modules", which needs a real directory; without extraction
# load_categories() returns an empty catalog and a phone scan completes 0/0
# without touching the network.
extract_packages = ["phonsint"]

[tool.flet.android.meta_data]
"com.google.android.gms.ads.APPLICATION_ID" = "ca-app-pub-5679949845754640~1261089274"

[tool.flet.android.permission]
"android.permission.INTERNET" = true
"android.permission.ACCESS_NETWORK_STATE" = true
# Screen stays on while a scan runs (ft.Wakelock).
"android.permission.WAKE_LOCK" = true
# Scan progress in the shade: the foreground service keeps the engine alive
# when the user leaves the app (flet-notifications 1.1.x).
"android.permission.FOREGROUND_SERVICE" = true
"android.permission.FOREGROUND_SERVICE_SPECIAL_USE" = true
"android.permission.POST_NOTIFICATIONS" = true

[tool.flet.android.service."com.dexterous.flutterlocalnotifications.ForegroundService"]
exported = false
foregroundServiceType = "specialUse"

# The special-use SUBTYPE is a <property> INSIDE the <service>, not an
# application-level <meta-data> — the installed plugin prescribes this exact
# nested table and flet-cli renders it as <property> under <service>.
[tool.flet.android.service."com.dexterous.flutterlocalnotifications.ForegroundService".property]
"android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE" = "Username/email OSINT scans stay alive in the background"

[tool.flet.android.feature]
"android.software.leanback" = false
"android.hardware.touchscreen" = true


[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = ["-ra", "-q"]
# Hard per-test ceiling: a hang (network stub regression, worker deadlock)
# fails that test instead of stalling CI for the default 0 (no limit).
timeout = 60
strict_markers = true
strict_config = true
markers = [
    "live: hits the real network (run explicitly with -m live; CI uses -m 'not live')",
]
filterwarnings = [
    # Owner rule: NEVER suppress/ignore warnings. Any warning raised by OUR
    # code (module-scoped below) escalates to a hard error so it must be
    # fixed. Third-party warnings are left at default — they stay visible in
    # pytest's warnings summary on every run, never ignored, but cannot
    # brick the suite for code we don't own.
    "error:::^(services|screens|components|core|state|hooks|tests)(\\.|$)|^(app_shell|main)$",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-timeout>=2.4",
    "ruff>=0.17.6",
]

[tool.ruff.lint]
select = [
    "E", "F", "W", "UP", "B", "Q", "C4", "PERF", "ERA", "I", "T20", "DTZ", "RUF",
    "S", "TRY", "BLE", "EM", "A", "SIM", "RET", "RSE",
]
ignore = [
    "E501",
    # Message-string style: this app raises with inline human messages on
    # purpose (owner rule: visible, specific errors); classes-per-message
    # would be churn with no behavioral gain.
    "EM101", "EM102", "EM103", "TRY003",
    # Wide-except + log (BLE001) and silent best-effort no-ops (S110,
    # SIM105) are the documented owner pattern across services/UI: cleanup,
    # restore, and persist paths intentionally pass on failure while every
    # load-bearing path logs. Narrowing 200+ sites is regression churn.
    "BLE001", "S110", "SIM105",
    # TRY300/TRY301 are style-only reshuffles inside engine hot paths
    # (email/sherlock) — churn risk with zero behavioral gain.
    "TRY300", "TRY301",
]

[tool.ruff.lint.per-file-ignores]
# Tests assert by design (pytest); S105 is a storage-KEY name, not a secret.
"tests/**" = ["S101"]

# Build-time pruning: serious_python cleanup globs — the ONLY channel that
# shrinks artifacts (post-build rm cannot; deps are re-packaged from
# project.dependencies into build/site-packages). Verified safe in
# the dependency audit §4/§5 (docs were removed in 2.3.0): locales are gettext our paths never read;
# oauthlib = flet OAuth (no login flow here); flask stack = maigret/web only.
[tool.flet.cleanup]
package_files = [
    "pycountry/locales/**/LC_MESSAGES/*.mo",
    "pycountry/locales/**/*.po",
    "oauthlib/**",
    "flask/**",
    "werkzeug/**",
    "click/**",
    "blinker/**",
    "itsdangerous/**",
    "asgiref/**",
    # phonenumbers ships ~19 MB of geocoder/carrier/timezone metadata that
    # phonsint never touches (it only parses/formats/validates and reads the
    # region code). shortdata is required by phonenumbers' own __init__, so
    # it stays.
    "phonenumbers/geodata/**",
    "phonenumbers/carrierdata/**",
    "phonenumbers/tzdata/**",
]
